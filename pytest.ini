[pytest]
testpaths = app_tests/tests
# Puts the repo root on sys.path so tests can `from app_tests.exponential_backoff import ...`
pythonpath = .
# Plain `async def test_...` needs no @pytest.mark.asyncio
asyncio_mode = auto
# Session, not function, because pytest-playwright-asyncio declares `playwright`
# and `browser` as session-*scoped* async fixtures with no explicit loop_scope --
# so they inherit this default, and `function` makes them a ScopeMismatch at
# setup. Both keys have to agree: a client built by a session-loop fixture and
# awaited from a function-loop test is a use-after-loop bug.
#
# The API tests do not need a shared loop; they tolerate one. Their isolation
# comes from a fresh `client` (own cookie jar) and a fresh `student` per test,
# not from the loop -- see app_tests/conftest.py.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
log_cli_level = WARNING
