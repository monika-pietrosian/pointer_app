[pytest]
testpaths = app_tests/tests
# Puts the repo root on sys.path so tests can `from app_tests.exponential_backoff import ...`
pythonpath = .
# Plain `async def test_...` needs no @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
log_cli_level = WARNING
