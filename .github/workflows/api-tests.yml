name: API tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      # The server does not read .env, so these are what it actually runs with.
      TEACHER_PASSWORD: ci-test-password
      SESSION_SECRET: ci-session-secret-not-a-real-one
      PORT: "3000"
      POINTS_API_URL: http://127.0.0.1:3000
      # Keeps the suite off server/data/students.json, so a test run can never
      # show up as a diff on the committed store. Relative to the repo root,
      # which is the cwd of both the "Start API" step and pytest. Both the
      # server and the conftest guard read this, so they must agree -- see
      # RISKS.md.
      POINTS_DATA_FILE: app_tests/data/students.test.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app_tests/requirements.txt

      - run: pip install -r app_tests/requirements.txt

      # pip installs the Playwright driver, not the browser binaries. Without
      # this the FE tests fail on the runner even though they pass locally.
      # --with-deps pulls the system libs chromium needs on a bare ubuntu image.
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start API
        run: |
          node server/server.js > server.log 2>&1 &
          echo $! > server.pid
        # No wait loop here on purpose: the server_is_up fixture polls
        # /api/session with exponential backoff, which is exactly the boot race
        # exponential_backoff.py exists for.

      - name: Run tests
        run: |
          pytest -n auto --dist load --junitxml=pytest-report.xml \
            --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure

      - name: Stop API
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Server log
        if: failure()
        run: cat server.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

      # test-results/ only gets populated for FE (Playwright) tests, and only
      # on failure (retain-on-failure / only-on-failure above), so a fully
      # green run uploads nothing -- if-no-files-found keeps that from being
      # reported as a warning.
      - name: Upload Playwright traces/videos/screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
